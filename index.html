  return `<div style="display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center">
    <h2 style="margin:0">Plano de ação · ${esc(rot)}</h2>
    <button class="btn btn-sec btn-mini" onclick="window.print()">Imprimir o plano</button>
  </div>
  <p style="color:var(--tinta2);max-width:78ch;margin-top:.6rem">Cada ação tem prazo, responsável, custo e como verificar se funcionou. A ordem não é arbitrária: <b>condição vem antes de formação</b>, formação coletiva antes de acompanhamento individual, e a reaplicação fecha o ciclo.</p>

  <div class="grid g4" style="margin:1.2rem 0">
    <div class="card metrica"><b>${nAcoes}</b><span>ações no plano</span></div>
    <div class="card metrica"><b style="color:var(--verde)">${semCusto}</b><span>não exigem verba</span></div>
    <div class="card metrica"><b style="color:${R.P.travas.length?'var(--coral)':'var(--verde)'}">${R.P.travas.length}</b><span>condições travando o resultado</span></div>
    <div class="card metrica"><b>180</b><span>dias até a prestação de contas</span></div>
  </div>

  ${FASES.map(F=>{
    const its = R.itens.filter(x=>x.fase===F.k);
    if(!its.length) return '';
    return `<div class="pa-fase ${F.cls}">

        <span class="tag" style="margin-left:auto">${its.length} ${its.length===1?'ação':'ações'}</span>
      </div>
      ${its.map(x=>{
        const R_ = RESP[x.tipo];
        return `<div class="pa-item">
          <div style="display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap">
            <b style="font-size:.96rem;color:var(--azul)">${esc(x.t)}</b>
            <span class="tag ${x.tipo==='condicao'?'c':x.tipo==='politica'?'a':''}">${x.tipo}</span>
            ${x.v!==null? `<span class="tag" style="margin-left:auto">${esc(x.ind)} · ${x.v}</span>`:''}
          </div>
          <p style="margin:.4rem 0 .35rem;font-size:.9rem;color:var(--tinta2)">${esc(x.d)}</p>
          <p style="margin:0;font-size:.89rem"><b style="color:var(--azul)">Como fazer.</b> <span style="color:var(--tinta2)">${esc(x.como)}</span></p>
          <div class="pa-meta">
            <div><b>Responsável</b>${R_.r}</div>
            <div><b>Custo</b>${R_.c}</div>
            <div><b>Como verificar</b>${R_.v}</div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('')}

  <div class="card dest" style="margin-top:1.4rem">
    <p style="margin:0 0 .5rem"><b>Três regras que fazem o plano funcionar</b></p>
    <p style="margin:0 0 .35rem;font-size:.9rem"><b>Condição antes de competência.</b> Onde contexto e competência estão baixos juntos, treinar primeiro é dinheiro perdido — e produz a conclusão errada de que formação não funciona.</p>
    <p style="margin:0 0 .35rem;font-size:.9rem"><b>Duas ou três frentes por semestre.</b> Agir em tudo é agir em nada. As demais esperam, e isso é escolha, não descuido.</p>
    <p style="margin:0;font-size:.9rem"><b>Sem reaplicação, não há plano.</b> Há intenção. O deslocamento em seis meses é o que sustenta o orçamento do ano seguinte.</p>
  </div>

  <div class="aviso" style="margin-top:1rem">
    <b>Este plano é sugestão automática a partir do diagnóstico.</b> Ele ordena e prioriza; não substitui a decisão de quem conhece a operação. Prazos e responsáveis são propostas a ajustar com a realidade da empresa.
  </div>`;
}

<script>
/* =====================================================================
   Estatística de grupo — dispersão, divergência e casos fora da curva
   ===================================================================== */

const dp = a => { if(a.length<2) return 0; const m=media(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1)); };
const mediana = a => { const b=[...a].sort((x,y)=>x-y), n=b.length; return n? (n%2? b[(n-1)/2] : (b[n/2-1]+b[n/2])/2) : 0; };
const quartil = (a,q) => { const b=[...a].sort((x,y)=>x-y); if(!b.length) return 0;
  const p=(b.length-1)*q, i=Math.floor(p), f=p-i; return b[i+1]!==undefined? b[i]+f*(b[i+1]-b[i]) : b[i]; };

/* z de cada pessoa em relação ao grupo — quantos desvios acima ou abaixo */
function zPessoa(g, p, chave){
  const vs = g.map(x=>x.pct[chave]).filter(v=>v!==undefined);
  const s = dp(vs); if(s < 1) return 0;
  return ((p.pct[chave]||0) - media(vs)) / s;
}

/* posição geral: média de todos os indicadores, e distância do centro do grupo */
function perfilGrupo(g){
  const inds = Object.keys(IND).filter(k=>g.filter(p=>p.pct[k]!==undefined).length >= 3);
  const est = {};
  inds.forEach(k=>{
    const vs = g.map(p=>p.pct[k]).filter(v=>v!==undefined);
    est[k] = {m:media(vs), s:dp(vs), md:mediana(vs), q1:quartil(vs,.25), q3:quartil(vs,.75),
              min:Math.min(...vs), max:Math.max(...vs), n:vs.length};
  });
  return {inds, est};
}

/* quem está fora da curva, e em quê */
function foraDaCurva(g, limite){
  const L = limite || 1.6;
  const {inds, est} = perfilGrupo(g);
  return g.map(p=>{
    const acima = [], abaixo = [];
    inds.forEach(k=>{
      if(p.pct[k]===undefined || est[k].s < 4) return;
      const z = (p.pct[k]-est[k].m)/est[k].s;
      if(z >= L) acima.push({k, z, v:p.pct[k], m:Math.round(est[k].m)});
      if(z <= -L) abaixo.push({k, z, v:p.pct[k], m:Math.round(est[k].m)});
    });
    const vs = inds.map(k=>p.pct[k]).filter(v=>v!==undefined);
    const mg = media(inds.map(k=>est[k].m));
    return {p, acima:acima.sort((a,b)=>b.z-a.z), abaixo:abaixo.sort((a,b)=>a.z-b.z),
            media:Math.round(media(vs)), dist:Math.round(media(vs)-mg),
            extremos:acima.length+abaixo.length};
  }).sort((a,b)=>b.extremos-a.extremos);
}

/* onde o grupo diverge — desvio alto significa que não há um comportamento comum */
function divergencias(g){
  const {inds, est} = perfilGrupo(g);
  return inds.map(k=>({k, ...est[k], amp:est[k].q3-est[k].q1}))
    .sort((a,b)=>b.s-a.s);
}

/* relação entre indicadores dentro do grupo — o que anda junto */
function correlacao(g, a, b){
  const pares = g.filter(p=>p.pct[a]!==undefined && p.pct[b]!==undefined).map(p=>[p.pct[a],p.pct[b]]);
  if(pares.length < 8) return null;
  const xs=pares.map(x=>x[0]), ys=pares.map(x=>x[1]);
  const mx=media(xs), my=media(ys);
  const num = pares.reduce((s,[x,y])=>s+(x-mx)*(y-my),0);
  const den = Math.sqrt(pares.reduce((s,[x])=>s+(x-mx)**2,0) * pares.reduce((s,[,y])=>s+(y-my)**2,0));
  return den? num/den : null;
}

/* pares de indicadores que mais andam juntos no grupo */
function paresLigados(g, top){
  const {inds} = perfilGrupo(g);
  const usa = inds.filter(k=>IND[k]);
  const out = [];
  for(let i=0;i<usa.length;i++) for(let j=i+1;j<usa.length;j++){
    const r = correlacao(g, usa[i], usa[j]);
    if(r !== null && Math.abs(r) >= .45) out.push({a:usa[i], b:usa[j], r});
  }
  return out.sort((x,y)=>Math.abs(y.r)-Math.abs(x.r)).slice(0, top||8);
}

/* =====================================================================
   Gráficos — SVG puro, sem biblioteca
   ===================================================================== */

/* radar de oito eixos */
function radar(valores, rotulos, cor, comparar){
  const R=78, C=118, n=rotulos.length;   /* raio menor: os rótulos precisam de margem */
  const pt = (v,i,raio) => {
    const a = (Math.PI*2*i/n) - Math.PI/2;
    const r = (raio||R) * clamp(v,0,100)/100;
    return [C + Math.cos(a)*r, C + Math.sin(a)*r];
  };
  const anel = f => rotulos.map((_,i)=>{
    const a=(Math.PI*2*i/n)-Math.PI/2;
    return `${C+Math.cos(a)*R*f},${C+Math.sin(a)*R*f}`;
  }).join(' ');
  const poli = vs => vs.map((v,i)=>pt(v,i).join(',')).join(' ');

  return `<svg viewBox="0 0 236 236" style="width:100%;max-width:300px;height:auto">
    ${[.25,.5,.75,1].map(f=>`<polygon points="${anel(f)}" fill="none" stroke="var(--linha2)" stroke-width="1"/>`).join('')}
    ${rotulos.map((_,i)=>{const [x,y]=pt(100,i); return `<line x1="${C}" y1="${C}" x2="${x}" y2="${y}" stroke="var(--linha2)" stroke-width="1"/>`;}).join('')}
    ${comparar? `<polygon points="${poli(comparar)}" fill="none" stroke="var(--tinta3)" stroke-width="1.5" stroke-dasharray="4 3"/>`:''}
    <polygon points="${poli(valores)}" fill="${cor||'var(--aco)'}" fill-opacity=".16" stroke="${cor||'var(--aco)'}" stroke-width="2"/>
    ${valores.map((v,i)=>{const [x,y]=pt(v,i); return `<circle cx="${x}" cy="${y}" r="3.5" fill="${cor||'var(--aco)'}"/>`;}).join('')}
    ${rotulos.map((t,i)=>{
      const [x,y]=pt(126,i);
      const anc = Math.abs(x-C)<14? 'middle' : (x>C? 'start':'end');
      return `<text x="${x}" y="${y}" text-anchor="${anc}" font-family="var(--texto)" font-size="8.5" fill="var(--tinta2)">${t}</text>
              <text x="${x}" y="${y+10}" text-anchor="${anc}" font-family="var(--mono)" font-size="9" font-weight="600" fill="${corDe(valores[i])}">${Math.round(valores[i])}</text>`;
    }).join('')}
  </svg>`;
}

/* dispersão: cada pessoa é um ponto, posicionado pela média e pela variação interna */
function dispersao(g, destaque){
  const W=560, H=300, P=42;
  const dados = g.map(p=>{
    const vs = Object.keys(IND).map(k=>p.pct[k]).filter(v=>v!==undefined);
    return {p, m:media(vs), s:dp(vs)};
  });
  const mx = dados.map(d=>d.m), sy = dados.map(d=>d.s);
  const x0=Math.min(...mx)-4, x1=Math.max(...mx)+4, y0=Math.min(...sy)-2, y1=Math.max(...sy)+2;
  const X = v => P + (v-x0)/((x1-x0)||1) * (W-P-16);
  const Y = v => H-P - (v-y0)/((y1-y0)||1) * (H-P-16);
  const mm = media(mx), ms = media(sy);

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <line x1="${P}" y1="${H-P}" x2="${W-8}" y2="${H-P}" stroke="var(--linha)" stroke-width="1"/>
    <line x1="${P}" y1="12" x2="${P}" y2="${H-P}" stroke="var(--linha)" stroke-width="1"/>
    <line x1="${X(mm)}" y1="12" x2="${X(mm)}" y2="${H-P}" stroke="var(--tinta3)" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="${P}" y1="${Y(ms)}" x2="${W-8}" y2="${Y(ms)}" stroke="var(--tinta3)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="${X(mm)+4}" y="20" font-size="8.5" fill="var(--tinta3)" font-family="var(--mono)">média do grupo</text>
    <text x="${W-10}" y="${H-P+16}" text-anchor="end" font-size="9" fill="var(--tinta2)">média das competências →</text>
    <text x="14" y="${18}" font-size="9" fill="var(--tinta2)" transform="rotate(-90 14 ${18})" text-anchor="end">↑ variação interna</text>
    ${dados.map(d=>{
      const dest = destaque && d.p.id===destaque;
      const cor = d.m>=mm+8? 'var(--verde)' : d.m<=mm-8? 'var(--coral)' : 'var(--aco)';
      return `<circle cx="${X(d.m)}" cy="${Y(d.s)}" r="${dest?7:4.5}" fill="${cor}" fill-opacity="${dest?1:.55}"
        stroke="${dest?'var(--azul)':'none'}" stroke-width="${dest?2:0}"><title>${esc(d.p.nome)} · média ${Math.round(d.m)} · variação ${Math.round(d.s)}</title></circle>`;
    }).join('')}
    ${[[x0+2,H-P+16,'menor'],[x1-2,H-P+16,'maior']].map(([x,y,t])=>`<text x="${X(x)}" y="${y}" font-size="8.5" fill="var(--tinta3)" font-family="var(--mono)" text-anchor="middle">${t}</text>`).join('')}
  </svg>`;
}

/* caixa: mostra a dispersão de um indicador no grupo */
function caixa(est, rot, largura){
  const W=largura||300, H=34;
  const X = v => 4 + (clamp(v,0,100)/100)*(W-8);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px">
    <line x1="${X(est.min)}" y1="${H/2}" x2="${X(est.max)}" y2="${H/2}" stroke="var(--linha)" stroke-width="1.5"/>
    <line x1="${X(est.min)}" y1="${H/2-6}" x2="${X(est.min)}" y2="${H/2+6}" stroke="var(--linha)" stroke-width="1.5"/>
    <line x1="${X(est.max)}" y1="${H/2-6}" x2="${X(est.max)}" y2="${H/2+6}" stroke="var(--linha)" stroke-width="1.5"/>
    <rect x="${X(est.q1)}" y="${H/2-9}" width="${X(est.q3)-X(est.q1)}" height="18" rx="3"
      fill="${corDe(est.m)}" fill-opacity=".22" stroke="${corDe(est.m)}" stroke-width="1.5"/>
    <line x1="${X(est.md)}" y1="${H/2-9}" x2="${X(est.md)}" y2="${H/2+9}" stroke="${corDe(est.m)}" stroke-width="2.5"/>
  </svg>`;
}
</script>


<script>
/* =====================================================================
   Análise do grupo — resumo, fora da curva, divergência e ligações
   ===================================================================== */
let pessoaAn = null;

function abaAnalise(base){
  const area = areaSel==='todas' ? null : areaSel;
  const g = area ? base.filter(p=>p.area===area) : base;
  const ag = agregaArea(base, area);
  const geral = agregaArea(base, null);
  if(!ag || g.length < 3) return '<div class="card">Grupo pequeno demais para análise estatística.</div>';
  if(pessoaAn !== null && g[pessoaAn]) return fichaAnalise(g[pessoaAn], g, ag, geral);

  const rot = area || 'Empresa inteira';
  const fora = foraDaCurva(g);
  const div = divergencias(g);
  const pares = paresLigados(g, 6);
  const inds = Object.keys(ag.ind);
  const fortes = inds.slice().sort((a,b)=>ag.ind[b]-ag.ind[a]).slice(0,5);
  const fracos = inds.slice().sort((a,b)=>ag.ind[a]-ag.ind[b]).slice(0,5);
  const eixosG = EIXOS.filter(e=>ag.eixos[e.n]!==undefined);
  const desalinhados = fora.filter(x=>x.extremos >= 2);

  return `<div style="display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center">
    <h2 style="margin:0">Análise do grupo · ${esc(rot)}</h2>
    <button class="btn btn-sec btn-mini" onclick="window.print()">Imprimir</button>
  </div>
  <p style="color:var(--tinta2);max-width:78ch;margin-top:.6rem">A média esconde tudo o que importa. Uma equipe com média 55 pode ter todo mundo em 55 — ou metade em 30 e metade em 80. As duas situações pedem coisas opostas, e é isso que esta tela mostra.</p>

  <div class="grid g4" style="margin:1.2rem 0">
    <div class="card metrica"><b>${g.length}</b><span>pessoas no grupo</span></div>
    <div class="card metrica"><b style="color:${corDe(media(Object.values(ag.eixos)))}">${fmt(media(Object.values(ag.eixos)))}</b><span>média dos eixos</span></div>
    <div class="card metrica"><b style="color:${div[0]&&div[0].s>18?'var(--ambar)':'var(--tinta)'}">${div[0]? Math.round(div[0].s):0}</b><span>maior dispersão interna</span></div>
    <div class="card metrica"><b style="color:${desalinhados.length?'var(--ambar)':'var(--verde)'}">${desalinhados.length}</b><span>pessoas fora da curva</span></div>
  </div>

  <div class="grid g2" style="align-items:start">
    <div class="card">
      <h3>Perfil do grupo pelos eixos</h3>
      <p class="apoio" style="margin:.2rem 0 .7rem">A linha tracejada é a média da empresa.</p>
      ${radar(eixosG.map(e=>ag.eixos[e.n]), eixosG.map(e=>e.t.split(' ')[0]),
              'var(--aco)', area? eixosG.map(e=>geral.eixos[e.n]) : null)}
    </div>
    <div class="card">
      <h3>Onde cada pessoa está</h3>
      <p class="apoio" style="margin:.2rem 0 .7rem">Cada ponto é uma pessoa. À direita, média mais alta. Acima, perfil mais irregular — forte numa coisa e fraco em outra.</p>
      ${dispersao(g)}
      <p class="apoio" style="margin-top:.5rem">Quem fica no <b>alto à esquerda</b> merece atenção: média baixa com variação grande costuma ser alguém com uma competência muito frágil puxando o resto para baixo.</p>
    </div>
  </div>

  <div class="divisor"></div>
  <div class="grid g2">
    <div class="card" style="border-left:3px solid var(--verde)">
      <h3>Pontos fortes do grupo</h3>
      ${fortes.map(k=>barra(IND[k][0], ag.ind[k], area? geral.ind[k]:null)).join('')}
    </div>
    <div class="card" style="border-left:3px solid var(--coral)">
      <h3>Pontos frágeis do grupo</h3>
      ${fracos.map(k=>barra(IND[k][0], ag.ind[k], area? geral.ind[k]:null)).join('')}
    </div>
  </div>

  <div class="divisor"></div>
  <h2>Onde o grupo não é homogêneo</h2>
  <p style="color:var(--tinta2);max-width:78ch">Dispersão alta significa que <b>não há um comportamento comum</b> na equipe: uns fazem, outros não. Isso muda a intervenção — formação para todos desperdiça o tempo de quem já domina, e acompanhamento individual não alcança o volume.</p>
  <div class="card" style="margin-top:1rem">
    ${div.slice(0,6).map(d=>`<div style="padding:.8rem 0;border-bottom:1px solid var(--linha2)">
      <div style="display:flex;justify-content:space-between;gap:.6rem;align-items:baseline;flex-wrap:wrap">
        <b style="font-size:.93rem">${IND[d.k][0]}</b>
        <span style="font-family:var(--mono);font-size:.72rem;color:var(--tinta2)">
          menor ${Math.round(d.min)} · mediana ${Math.round(d.md)} · maior ${Math.round(d.max)}
          <span class="tag ${d.s>=18?'a':''}" style="margin-left:.4rem">dispersão ${Math.round(d.s)}</span></span>
      </div>
      ${caixa(d, IND[d.k][0])}
      <p style="margin:0;font-size:.85rem;color:var(--tinta2)">${
        d.s>=20? 'Diferença muito grande dentro da equipe. Vale usar quem está no topo como âncora de quem está na base — a distância aqui é de aprendizado, não de talento.'
        : d.s>=14? 'Diferença relevante. Formação em grupo funciona, desde que as equipes sejam mistas.'
        : 'Grupo homogêneo nesta competência. Se o valor é baixo, é problema coletivo — e a causa provavelmente está no contexto, não nas pessoas.'}</p>
    </div>`).join('')}
  </div>

  ${pares.length? `<div class="divisor"></div>
  <h2>O que anda junto neste grupo</h2>
  <p style="color:var(--tinta2);max-width:78ch">Competências que sobem e descem juntas nas mesmas pessoas. Isso indica onde <b>uma intervenção pode render em duas frentes</b> — e também onde a leitura pode estar medindo a mesma coisa duas vezes.</p>
  <div class="grid g2" style="margin-top:1rem">
    ${pares.map(x=>`<div class="card info">
      <div style="display:flex;justify-content:space-between;gap:.5rem;align-items:baseline">
        <b style="font-size:.9rem">${IND[x.a][0]} <span style="color:var(--tinta3)">${x.r>0?'e':'contra'}</span> ${IND[x.b][0]}</b>
        <span class="tag ${x.r>0?'v':'c'}">${x.r>0?'+':''}${x.r.toFixed(2)}</span>
      </div>
      <p style="margin:.3rem 0 0;font-size:.86rem;color:var(--tinta2)">${
        x.r>0 ? 'Quem tem uma, costuma ter a outra. Desenvolver uma provavelmente move a outra junto.'
              : 'Andam em direções opostas neste grupo. Vale entender por quê antes de tratar como coincidência.'}</p>
    </div>`).join('')}
  </div>
  <p class="apoio" style="margin-top:.7rem">Correlação não é causa. O que a tela mostra é que as duas coisas aparecem juntas — não que uma produza a outra.</p>`:''}

  <div class="divisor"></div>
  <h2>Quem está fora da curva</h2>
  <p style="color:var(--tinta2);max-width:78ch">Pessoas cujo resultado se afasta do grupo em uma ou mais competências, para cima ou para baixo. <b>Para cima é ativo</b>: são âncoras naturais. <b>Para baixo é sinal</b>: alguém que a formação coletiva não vai alcançar.</p>

  ${desalinhados.length? `<div class="card" style="margin-top:1rem">
    ${desalinhados.slice(0,12).map((x,i)=>`<div class="pess-lin" style="cursor:pointer" onclick="pessoaAn=${g.indexOf(x.p)};render()">
      <span class="pess-n">${i+1}</span>
      <span>
        <b style="font-size:.92rem;color:var(--azul)">${esc(x.p.nome)}</b>
        <span style="color:var(--tinta2);font-size:.8rem"> · ${esc(x.p.area)}${x.p.lider?' · lidera':''}</span>
        <span style="display:block;margin-top:.25rem">
          ${x.acima.slice(0,3).map(a=>`<span class="tag v">↑ ${IND[a.k][0]} ${a.v} <span style="opacity:.6">grupo ${a.m}</span></span>`).join(' ')}
          ${x.abaixo.slice(0,3).map(a=>`<span class="tag c">↓ ${IND[a.k][0]} ${a.v} <span style="opacity:.6">grupo ${a.m}</span></span>`).join(' ')}
        </span>
      </span>
      <span style="text-align:right;white-space:nowrap">
        <b style="font-family:var(--disp);font-size:1.05rem;color:${x.dist>=0?'var(--verde)':'var(--coral)'}">${x.dist>=0?'+':''}${x.dist}</b>
        <span style="display:block;font-family:var(--mono);font-size:.62rem;color:var(--tinta3)">vs grupo</span>
      </span>
    </div>`).join('')}
  </div>` : `<div class="ok-box" style="margin-top:1rem">
    <b>Ninguém se afasta significativamente do grupo.</b> A equipe é homogênea — o que facilita a formação coletiva e significa que o resultado, bom ou ruim, é de todos.</div>`}

  <div class="aviso" style="margin-top:1.2rem">
    <b>Fora da curva não é problema nem mérito.</b> Descreve distância em relação a este grupo específico — a mesma pessoa em outra equipe poderia estar no meio. Serve para escolher quem apoia quem, não para classificar ninguém.
  </div>`;
}

/* ── ficha de análise individual ────────────────────────── */
function fichaAnalise(p, g, ag, geral){
  const {est} = perfilGrupo(g);
  const eixosP = EIXOS.filter(e=>p.eixos[e.n]!==undefined);
  const zs = Object.keys(IND).filter(k=>p.pct[k]!==undefined && est[k] && est[k].s>=4)
    .map(k=>({k, v:p.pct[k], m:Math.round(est[k].m), z:(p.pct[k]-est[k].m)/est[k].s}))
    .sort((a,b)=>b.z-a.z);
  const acima = zs.filter(x=>x.z>=1).slice(0,5);
  const abaixo = zs.filter(x=>x.z<=-1).slice(-5).reverse();
  const ctxBaixo = Object.keys(DIM_CTX).filter(d=>p.ctx[d] < 48);

  return `<div style="display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem">
    <div>
      <p class="coord">Análise individual no grupo</p>
      <h2 style="margin:.2rem 0 0">${esc(p.nome)}</h2>
      <p style="margin:.1rem 0 0;color:var(--tinta2);font-size:.9rem">${esc(p.area)}${p.lider?' · lidera equipe':''} · ${p.tempo} ${p.tempo===1?'ano':'anos'} de casa</p>
    </div>
    <button class="btn btn-sec btn-mini" onclick="pessoaAn=null;render()">← Voltar à análise</button>
  </div>

  <div class="grid g2" style="align-items:start">
    <div class="card">
      <h3>Perfil pelos eixos</h3>
      <p class="apoio" style="margin:.2rem 0 .7rem">A linha tracejada é a média da equipe.</p>
      ${radar(eixosP.map(e=>p.eixos[e.n]), eixosP.map(e=>e.t.split(' ')[0]), 'var(--aco)', eixosP.map(e=>ag.eixos[e.n]))}
    </div>
    <div class="card">
      <h3>Posição dentro do grupo</h3>
      <p class="apoio" style="margin:.2rem 0 .7rem">O ponto destacado é esta pessoa.</p>
      ${dispersao(g, p.id)}
    </div>
  </div>

  <div class="grid g2" style="margin-top:1.2rem">
    <div class="card" style="border-left:3px solid var(--verde)">
      <h3>Onde se destaca no grupo</h3>
      <p class="apoio" style="margin:.2rem 0 .7rem">Acima do que a equipe costuma apresentar. É aqui que esta pessoa pode apoiar colegas.</p>
      ${acima.length? acima.map(x=>`<div style="padding:.45rem 0;border-bottom:1px solid var(--linha2)">
        <div style="display:flex;justify-content:space-between;gap:.5rem">
          <span style="font-size:.9rem">${IND[x.k][0]}</span>
          <span style="font-family:var(--mono);font-size:.8rem"><b style="color:var(--verde)">${x.v}</b>
            <span style="color:var(--tinta3)"> · grupo ${x.m}</span></span>
        </div></div>`).join('') : '<p class="nota" style="margin:0">Sem destaque acima do grupo.</p>'}
    </div>
    <div class="card" style="border-left:3px solid var(--coral)">
      <h3>Onde fica atrás do grupo</h3>
      <p class="apoio" style="margin:.2rem 0 .7rem">Abaixo do que a equipe apresenta. Formação coletiva pode não alcançar.</p>
      ${abaixo.length? abaixo.map(x=>`<div style="padding:.45rem 0;border-bottom:1px solid var(--linha2)">
        <div style="display:flex;justify-content:space-between;gap:.5rem">
          <span style="font-size:.9rem">${IND[x.k][0]}</span>
          <span style="font-family:var(--mono);font-size:.8rem"><b style="color:var(--coral)">${x.v}</b>
            <span style="color:var(--tinta3)"> · grupo ${x.m}</span></span>
        </div></div>`).join('') : '<p class="nota" style="margin:0">Nenhuma competência significativamente abaixo do grupo.</p>'}
    </div>
  </div>

  ${ctxBaixo.length? `<div class="card alerta" style="margin-top:1.2rem">
    <p style="margin:0 0 .4rem"><b>Antes de concluir qualquer coisa sobre esta pessoa</b></p>
    <p style="margin:0;font-size:.9rem">Ela avaliou como frágil: <b>${ctxBaixo.map(d=>DIM_CTX[d][0].toLowerCase()).join(', ')}</b>. Parte do que aparece baixo pode não ser sobre ela — e a conversa deveria começar por aí.</p>
  </div>`:''}

  ${abaixo.length? `<div class="divisor"></div>
  <h2>O que fazer com esta pessoa</h2>
  <div class="grid g3" style="margin-top:1rem">
    ${abaixo.slice(0,3).map((x,i)=>{
      const T = TRILHA[x.k] || {o:'Praticar de forma deliberada.', a:'Uma situação por semana.'};
      const anc = ancoras(g, x.k).filter(a=>a.id!==p.id).slice(0,2);
      return `<div class="card">
        <span class="tag a">PRIORIDADE ${i+1}</span>
        <h3 style="margin:.5rem 0 .2rem;font-size:.98rem">${IND[x.k][0]}</h3>
        <p style="margin:0 0 .4rem;font-family:var(--mono);font-size:.66rem;color:var(--tinta3)">ESTÁ EM ${x.v} · GRUPO ${x.m}</p>
        <p style="margin:0 0 .4rem;font-size:.87rem;color:var(--tinta2)"><b>O que trabalhar.</b> ${T.o}</p>
        <p style="margin:0 0 .4rem;font-size:.87rem;color:var(--tinta2)"><b>Primeiro passo.</b> ${T.a}</p>
        ${anc.length? `<p style="margin:0;font-size:.85rem;color:var(--turq)"><b>Quem pode apoiar:</b> ${anc.map(a=>esc(a.nome.split(' ')[0])).join(' ou ')}</p>`:''}
      </div>`;
    }).join('')}
  </div>`:''}`;
}
</script>

  d:'Tensão isolada: a pior combinação do modelo demanda-controle-apoio. A pessoa responde a muito, sozinha.',
  p:'Antes de mexer na carga, verificar se existe a quem recorrer. Apoio disponível muda o desfecho da mesma carga.'},
 {a:'reconhecimento', b:'carga', t:'Alto esforço com baixo reconhecimento',
  d:'Desequilíbrio esforço-recompensa descrito por Siegrist. O que adoece não é o esforço: é a assimetria sustentada entre o que se investe e o que retorna.',
  p:'Reconhecimento aqui não é salário. É retorno, critério explícito e perspectiva.'},
 {a:'fronteira', b:'carga', t:'Fronteira frágil com carga alta',
  d:'Recuperação impedida. A pessoa gasta e não repõe — e o que impede a reposição não é o volume de mensagens, é a antecipação de que possam chegar.',
  p:'Política de desconexão com exemplo da liderança. Quem espera ser acionado não descansa mesmo sem ser acionado.'},
 {a:'clareza_r', b:'controle', t:'Baixa clareza com baixa autonomia',
  d:'Ambiguidade de papel sustentada: não saber o que se espera e não poder decidir. Um dos preditores mais consistentes de exaustão.',
  p:'Descrever a função e o critério de avaliação. Custa uma página por função e resolve boa parte.'},
];

const MIN_RISCO = 8;   /* trava: abaixo disso, nada é exibido */

function nivelRisco(v){
  if(v >= 62) return {n:'baixo', c:'v', t:'Baixo'};
  if(v >= 45) return {n:'atencao', c:'a', t:'Atenção'};
  return {n:'critico', c:'c', t:'Crítico'};
}

/* gerado junto com a base — deriva do contexto, com ruído próprio */
function riscoDaArea(base, area){
  const g = area ? base.filter(p=>p.area===area) : base;
  if(g.length < MIN_RISCO) return {insuficiente:true, n:g.length};
  const r = rng((area||'geral').split('').reduce((a,c)=>a+c.charCodeAt(0),0)*31);
  const dims = {};
  Object.keys(DIM_RISCO).forEach(d=>{
    /* ancorado no contexto organizacional já medido, com desvio próprio */
    const base_ = d==='carga' ? media(g.map(p=>p.ctx.condicoes))
                : d==='controle' ? media(g.map(p=>p.ctx.clareza))*.6 + media(g.map(p=>p.ctx.seguranca))*.4
                : d==='apoio' ? media(g.map(p=>p.ctx.seguranca))*.5 + media(g.map(p=>p.ctx.pertencimento))*.5
                : d==='reconhecimento' ? media(g.map(p=>p.ctx.devolutiva))*.6 + media(g.map(p=>p.ctx.pertencimento))*.4
                : d==='clareza_r' ? media(g.map(p=>p.ctx.clareza))
                : media(g.map(p=>p.ctx.condicoes))*.5 + media(g.map(p=>p.ctx.pertencimento))*.5;
    dims[d] = Math.round(clamp(base_ + (r()+r()-1)*14, 8, 95));
  });
  const combos = COMBINACOES.map(c=>({...c, va:dims[c.a], vb:dims[c.b],
      crit: dims[c.a] < 50 && dims[c.b] < 50})).filter(c=>c.crit);
  return {dims, combos, n:g.length,
    geral: Math.round(media(Object.values(dims))),
    criticas: Object.keys(dims).filter(d=>dims[d]<45)};
}

/* ── tela ───────────────────────────────────────────────── */
function abaRisco(base){
  const area = areaSel==='todas' ? null : areaSel;
  const R = riscoDaArea(base, area);
  const rot = area || 'Empresa inteira';

  if(R.insuficiente) return `<h2>Riscos psicossociais · ${esc(rot)}</h2>
    <div class="card alerta" style="margin-top:1rem">
      <p style="margin:0 0 .4rem"><b>Resultado não exibido: ${R.n} ${R.n===1?'respondente':'respondentes'}</b></p>
      <p style="margin:0;font-size:.9rem">Áreas com menos de ${MIN_RISCO} pessoas não têm o resultado exibido — nem agregado. Abaixo desse número, quem respondeu o quê fica identificável, e a garantia de anonimato é o que sustenta a resposta honesta neste bloco.</p>
    </div>`;

  const ordenadas = Object.keys(R.dims).sort((a,b)=>R.dims[a]-R.dims[b]);

  return `<div style="display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center">
    <h2 style="margin:0">Riscos psicossociais · ${esc(rot)}</h2>
    <button class="btn btn-sec btn-mini" onclick="window.print()">Gerar documento</button>
  </div>

  <div class="card info" style="margin-top:1rem">
    <p style="margin:0;font-size:.92rem"><b>Este módulo mede o trabalho, não as pessoas.</b> Nenhuma pergunta é sobre humor, sintoma ou saúde, e nenhum resultado individual existe — nem para o RH, nem para a liderança, nem no banco de dados. O que se mede são as condições que a pesquisa associa a adoecimento, para que elas possam ser corrigidas.</p>
  </div>

  <div class="grid g4" style="margin:1.2rem 0">
    <div class="card metrica"><b>${R.n}</b><span>respondentes</span></div>
    <div class="card metrica"><b style="color:${corDe(R.geral)}">${R.geral}</b><span>índice geral de condições</span></div>
    <div class="card metrica"><b style="color:${R.criticas.length?'var(--coral)':'var(--verde)'}">${R.criticas.length}</b><span>${R.criticas.length===1?'dimensão em nível crítico':'dimensões em nível crítico'}</span></div>
    <div class="card metrica"><b style="color:${R.combos.length?'var(--coral)':'var(--verde)'}">${R.combos.length}</b><span>combinações de risco</span></div>
  </div>

  <div class="grid g2" style="align-items:start">
    <div class="card">
      <h3>As seis dimensões</h3>
      <p class="apoio" style="margin:.2rem 0 .7rem">Quanto maior o valor, melhor a condição. Abaixo de 45 é crítico; entre 45 e 62, atenção.</p>
      ${radar(Object.keys(DIM_RISCO).map(d=>R.dims[d]),
              Object.keys(DIM_RISCO).map(d=>DIM_RISCO[d][0].split(' ')[0]), 'var(--coral)')}
    </div>
    <div class="card">
      <h3>Detalhe por dimensão</h3>
      ${ordenadas.map(d=>{
        const N = nivelRisco(R.dims[d]);
        return `<div style="padding:.6rem 0;border-bottom:1px solid var(--linha2)">
          <div style="display:flex;justify-content:space-between;gap:.5rem;align-items:baseline">
            <b style="font-size:.9rem">${DIM_RISCO[d][0]}</b>
            <span><span class="tag ${N.c}">${N.t}</span>
              <b style="font-family:var(--mono);font-size:.9rem;margin-left:.4rem;color:${corDe(R.dims[d])}">${R.dims[d]}</b></span>
          </div>
          <span class="bar" style="display:block;margin-top:.35rem"><i style="width:${R.dims[d]}%;background:${corDe(R.dims[d])}"></i></span>
          <p style="margin:.25rem 0 0;font-size:.82rem;color:var(--tinta3)">${DIM_RISCO[d][1]}</p>
        </div>`;
      }).join('')}
    </div>
  </div>

  ${R.combos.length? `<div class="divisor"></div>
  <h2>Combinações que exigem atenção</h2>
  <p style="color:var(--tinta2);max-width:78ch">Dimensões isoladas dizem menos que a combinação entre elas. A literatura identifica combinações específicas como as de maior risco — e são estas que apareceram nesta seleção.</p>
  <div style="margin-top:1.2rem">
    ${R.combos.map((c,i)=>`<div class="card" style="border-left:3px solid var(--coral);margin-bottom:.8rem">
      <div style="display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap">
        <b style="font-size:.98rem;color:var(--azul)">${c.t}</b>
        <span class="tag c">${DIM_RISCO[c.a][0]} ${c.va}</span>
        <span class="tag c">${DIM_RISCO[c.b][0]} ${c.vb}</span>
      </div>
      <p style="margin:.5rem 0 .4rem;font-size:.9rem;color:var(--tinta2)">${c.d}</p>
      <p style="margin:0;font-size:.9rem"><b style="color:var(--azul)">Por onde começar.</b> <span style="color:var(--tinta2)">${c.p}</span></p>
    </div>`).join('')}
  </div>`:`<div class="ok-box" style="margin-top:1.2rem">
    <b>Nenhuma combinação crítica nesta seleção.</b> As dimensões que aparecem mais baixas não estão associadas entre si de forma que a literatura identifique como de maior risco.</div>`}

  <div class="divisor"></div>
  <h2>Medidas para o plano de gerenciamento</h2>
  <p style="color:var(--tinta2);max-width:78ch">Todas as medidas abaixo são <b>organizacionais</b>. Risco psicossocial é do trabalho, e a literatura de intervenção é consistente: medidas focadas no indivíduo produzem efeito pequeno e temporário; medidas sobre a organização do trabalho produzem efeito maior e duradouro.</p>
  <div class="card" style="margin-top:1rem">
    ${ordenadas.filter(d=>R.dims[d]<62).map(d=>{
      const N = nivelRisco(R.dims[d]);
      return `<div style="padding:.8rem 0;border-bottom:1px solid var(--linha2)">
        <div style="display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap">
          <b style="font-size:.93rem">${DIM_RISCO[d][0]}</b>
          <span class="tag ${N.c}">${N.t} · ${R.dims[d]}</span>
          <span class="tag" style="margin-left:auto">${N.n==='critico'?'ação imediata':'prazo definido'}</span>
        </div>
        <p style="margin:.3rem 0 0;font-size:.89rem;color:var(--tinta2)">${DIM_RISCO[d][2]}</p>
      </div>`;
    }).join('') || '<p class="nota" style="margin:0">Nenhuma dimensão exige medida no momento. Documentar o que sustenta esse resultado e monitorar na reaplicação.</p>'}
  </div>

  <div class="divisor"></div>
  <div class="grid g2">
    <div class="card" style="border-left:3px solid var(--coral)">
      <h3>O que não fazer com este resultado</h3>
      <p style="margin:.5rem 0 .4rem;font-size:.89rem;color:var(--tinta2)">Procurar quem respondeu o quê.</p>
      <p style="margin:0 0 .4rem;font-size:.89rem;color:var(--tinta2)">Convocar pessoas de uma área para conversa sobre saúde mental com base nestes números.</p>
      <p style="margin:0 0 .4rem;font-size:.89rem;color:var(--tinta2)">Encaminhar alguém a atendimento por causa do instrumento.</p>
      <p style="margin:0;font-size:.89rem;color:var(--tinta2)">Registrar qualquer indício em ficha funcional.</p>
    </div>
    <div class="card" style="border-left:3px solid var(--verde)">
      <h3>O que fazer</h3>
      <p style="margin:.5rem 0 .4rem;font-size:.89rem;color:var(--tinta2)">Tratar a condição de trabalho da área, não as pessoas dela.</p>
      <p style="margin:0 0 .4rem;font-size:.89rem;color:var(--tinta2)">Comunicar o canal de apoio psicológico <b>a todos</b>, de forma voluntária e desvinculada deste resultado.</p>
      <p style="margin:0 0 .4rem;font-size:.89rem;color:var(--tinta2)">Registrar a medida adotada, com prazo e responsável.</p>
      <p style="margin:0;font-size:.89rem;color:var(--tinta2)">Reaplicar e demonstrar o que mudou.</p>
    </div>
  </div>

  <div class="aviso" style="margin-top:1.2rem">
    <b>Limites deste módulo.</b> Não é diagnóstico, não é rastreio e não é triagem. Não substitui avaliação de saúde ocupacional nem o trabalho do serviço especializado. As dimensões partem de modelos consolidados, mas o recorte e a redação são próprios e não passaram por validação psicométrica — para uso como evidência formal, considere um instrumento já validado em português, com este módulo como complemento de gestão. A responsabilidade legal permanece da empresa.
  </div>`;
}
</script>
